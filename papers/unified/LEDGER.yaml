    walls: {probability: "the threshold sets {L = tau}, {U = tau}", support: "faces of D: the fibre dimension jumps when an edit leaves one", tropical: undefined, critical: undefined, stokes: undefined, context: "the CH facets: crossing empties the fibre and makes the contextual fraction positive"}
    wall_certificate: "dual vertices enumerated exactly; circuits exact; facet list exact (MS3)"
    checks: [PG1, PG2, PG3, PG4, PG5, PG6]
  - id: bayes-inversion
    operation: "Bayesian inversion of a coupling, against composition rules (sections of the chain cover)"
    assumptions: "finite variables; chains of couplings with rational entries in the exact checks; drift numbers from Study 18's frozen output"
    parameter_map: "(p, K) -> (q, Kdag), Kdag = p K / q on q > 0; in Cpl gamma -> gamma^T; reversal x_ijk -> x_kji on the chain fibre"
    levels:
      contingency: {status: Exact, text: "Markov gluing and selection commute with inversion on 40 random rational chains; a non-equivariant vertex rule commutes on 13/40; null middle states never reach a composite; a structural zero with full-support margins keeps unique inverses and a positive-width interval"}
