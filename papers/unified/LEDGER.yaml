  - id: value-of-information
    operation: "Decisions over a fibre: utility image, value of identification (minimax regret), instance information, dilation, Das's commuting square"
    assumptions: "finite actions with utilities linear in the joint law; CHSH data; act / abstain with symmetric payoffs for the example; a binary signal of accuracy alpha"
    parameter_map: "R(d) = min_a max_b U_ab(d), U_ab = upper end of (u_b - u_a).P over J_d; instance value sum_z |a_z| - |sum_z a_z|"
    levels:
      contingency: {status: Exact, text: "act / abstain closed forms R = 2 min((tau - L)+, (U - tau)+) and randomisation gap R/2; Good's inequality as a triangle inequality"}
      toric: {status: Proved, text: "utility image a polytope; identified iff R = 0; R <= width against an action optimal somewhere; R Lipschitz; more contexts never raise R; R = 0 on rigid faces; mixing: L convex, U and width concave; committed robust VOI >= 0, mixed policies via the minimax theorem"}
      mirror: {status: Numerical, text: "staged routes: route A R = 0 while the decision flips; route B R > 0 on (1222, 11890) units, peak 0.258; pure-policy robust value leaves the envelope by exactly the value of randomising; dilation for some outcome 300/300, strict 9/300; Das square gap 0.084-0.274 (random), 0.220-0.459 (rigid faces)"}
      floer: {status: N/A, text: "no Floer statement"}
      category: {status: Defined, text: "commit-then-condition versus condition-then-select as a square; it fails for re-selection on marginal data"}
    walls: {probability: "indifference hyperplanes u_a.P = u_b.P", support: "faces of D: R = 0 and no dilation on rigid faces", tropical: undefined, critical: "the critical accuracy where a signal starts to have decision value", stokes: undefined, context: undefined}
    wall_certificate: "linear programs for every U_ab; exact fibre vertices for Hausdorff distances"
    checks: [VG1, VG2, VG3, VG4, VG5, VG6, VG7, VG8]
  - id: voi-determination
    operation: "When local data determine the value of information; value-based distance between fibres"
    assumptions: "CHSH data; finite actions with utilities linear in the joint law; signals that are functions of the reading; utilities bounded by 1 for the distance"
