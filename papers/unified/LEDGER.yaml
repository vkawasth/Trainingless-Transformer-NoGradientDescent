      floer: {status: N/A, text: "no Floer statement"}
      category: {status: Proved, text: "(standard categorical construction) the dagger of Cpl is Bayesian inversion (Cho-Jacobs); composition by a reversal-equivariant section commutes with it; on binary-end chains every linear rule with a unique optimum does; inversion is a symmetry of the marginal projection, not a section"}
