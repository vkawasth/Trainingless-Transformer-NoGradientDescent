      toric: {status: Proved, text: "certified radii c_some >= (L - tau)/Lam_L, c_all >= (U - tau)/Lam_U; width Lipschitz with Lam_L + Lam_U while fibre dimension jumps; closed-form distance to the contextuality boundary; continuous rules with unique optima are continuous (Berge with Lipschitz fibres)"}
